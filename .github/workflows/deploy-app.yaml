name: Deploy Application

on:
  push:
    branches: [main]
    paths:
      - 'app/version.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build application
        id: build
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npm ci
          npm run build:production
          echo "dist_path=$(realpath dist)" >> "$GITHUB_OUTPUT"
      - name: Prepare texlive build environment
        shell: bash
        run: |
          set -euo pipefail
          deps=()
          if [ -f guide/texlive.deps ]; then
            mapfile -t deps < <(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' guide/texlive.deps)
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            latexmk \
            "${deps[@]}"
      - name: Compile guides
        shell: bash
        working-directory: guide
        run: |
          set -euo pipefail
          dist="${{ steps.build.outputs.dist_path }}/assets"
          mkdir -p "$dist"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          for source in . */; do
            [ -d "$source/chapters" ] || continue
            [ -d "$source/assets" ] || continue

            suffix=""
            if [ "$source" != . ]; then
              suffix=".$(basename "$source")"
            fi
            target="$dist/DM-Guide${suffix}.pdf"
            build=$(mktemp -d "$work/build.XXXXXXXX")

            cp guide.tex theme.sty latexmkrc "$build/"
            cp -R "$source/chapters" "$source/assets" "$build/"

            echo "Compiling $target"
            (
              cd "$build"
              latexmk -xelatex guide.tex
            )

            if cmp -s "$build/guide.pdf" "$target"; then
              echo "Unchanged: $target"
            else
              cp "$build/guide.pdf" "$target"
              echo "Updated: $target"
            fi
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload application
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.build.outputs.dist_path }}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v5