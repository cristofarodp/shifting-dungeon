- title: The Moving Walls
  text: Every time we opened a door, the stone groaned somewhere beyond us. The chambers moved, but never the two joined by the open doorway. Listen carefully. The sound may tell you where the dungeon has shifted.
  id: the-moving-walls
- title: The World Without Edges
  text: We marched east until we found ourselves approaching familiar chambers from the west. There is no outer wall to this cursed place. The dungeon folds back upon itself.
  id: the-world-without-edges
- title: A Lock Has Two Faces
  text: I swear the door was locked when we approached it from the other chamber. From this side, it opened freely. Do not trust what you remember about a doorway.
  id: a-lock-has-two-faces
- title: Six Seconds
  text: The doors refuse to remain open. Neither steel nor stone can stop them closing. Worse still, no other door will open while one stands ajar.
  id: six-seconds
- title: The Returning Dead
  text: We cleared the chamber of skeletons, only to find them waiting for us upon our return. Yet the great guardian we slew never rose again. There is some mercy in this place.
  id: the-returning-dead
- title: Beyond the Threshold
  text: The beasts cannot follow us through the doors. Our arrows and spells fare no better. Sometimes retreat is the only weapon you need.
  id: beyond-the-threshold
- title: The Last Chambers
  text: As the last unexplored chambers dwindled, the dungeon began devouring itself. We counted four remaining before the nightmare started. Do not mistake thorough exploration for safety.
  id: the-last-chambers
- title: Fool’s Fortune
  text: We found a magnificent treasure and fled as the chambers crumbled behind us. When we reached the entrance, our prize vanished. Even the destruction had been a lie. Trust nothing merely because it glitters.
  id: fools-fortune-notes
- title: The Way Home
  text: When the dungeon begins to crumble, do not linger. Empty chambers disappear behind those who pass through their doors. The entrance, however, has never moved, nor have I seen it destroyed.
  id: the-way-home
- title: One Life for Many
  text: The guardian left behind a rune that pulsed like a beating heart. With it, our fallen companions returned to life. When its bearer died, the rune passed into another’s possession. Guard it well.
  id: one-life-for-many
